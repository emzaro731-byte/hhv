<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>HHV — Review</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.top{height:68px;border-bottom:1px solid #252a35;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;background:#0c0f15ee;backdrop-filter:blur(16px);z-index:5}.brand{font-size:22px;font-weight:850}.actions{display:flex;gap:9px}.btn{border:1px solid #303746;background:#171b24;color:#eee;border-radius:13px;padding:10px 14px;font-weight:700}.primary{background:#6b86ff;border-color:#8198ff}.main{max-width:1100px;margin:auto;padding:22px;display:grid;grid-template-columns:1fr 380px;gap:28px}.left h1{font-size:34px;margin:12px 0 6px}.muted{color:#8f97a8}.panel{border:1px solid #252c3a;background:#11151d;border-radius:22px;padding:18px;margin-top:18px}.phoneWrap{display:flex;justify-content:center}.phone{width:320px;height:650px;border:10px solid #202631;border-radius:42px;background:#0b0d12;box-shadow:0 25px 80px #000;overflow:hidden;position:relative}.notch{height:25px;width:120px;background:#080a0e;border-radius:0 0 16px 16px;margin:auto}.screen{height:calc(100% - 25px);padding:20px 18px;overflow:auto;background:radial-gradient(circle at 20% 0,#243866,#0b1020 42%,#080b11)}.screen h2{font-size:26px;margin:20px 0 8px}.screen p{color:#aeb7ca;line-height:1.5}.mockCard{padding:16px;border-radius:18px;background:#151d30;border:1px solid #34496f;margin:12px 0}.mockButton{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin:10px 0;background:#5f7dff;color:white;font-weight:700}.chat{margin-top:16px}.bubble{padding:12px 14px;border-radius:16px;background:#171c27;margin:8px 0}.userB{background:#304d9b;margin-left:35px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tag{padding:8px 10px;border:1px solid #303747; ons||[]),...(spec.files||[])].slice(0,8);$('tags').innerHTML=tags.map(x=>'<span class="tag">'+esc(typeof x==='string'?x:(x.name||x.type||''))+'</span>').join('');mock()}function mock(){let name=spec.project_name||'My App',type=(spec.app_type||'app').toLowerCase();let body='<h2>'+esc(name)+'</h2><p>Native Android preview</p>';if(type.includes('ai')||type.includes('assistant'))body+='<div class="mockCard"><b>AI Assistant</b><p>How can I help you today?</p><button class="mockButton">Start chatting</button></div><div class="chat"><div class="bubble">Hello! I am your AI assistant.</div><div class="bubble userB">Help me build my app.</div></div>';else if(type.includes('store')||type.includes('shop'))body+='<div class="mockCard"><b>Featured products</b><p>Browse products and add them to your cart.</p><button class="mockButton">Shop now</button></div><div class="mockCard">Product catalog<br><br>🛍️ Item • $29</div>';else if(type.includes('music'))body+='<div class="mockCard"><b>Now playing</b><p>Discover music, artists and playlists.</p><button class="mockButton">▶ Play</button></div><div class="mockCard">Your playlists<br><br>🎵 Favorites</div>';else body+='<div class="mockCard"><b>Welcome</b><p>Your generated app interface will appear here. This review is a visual preview before the native Android build.</p><button class="mockButton">Get started</button></div><div class="mockCard">Home · Explore · Profile</div>';$('screen').innerHTML=body}function reloadPreview(){$('status').textContent='Preview refreshed';render()}async function build(){let a=spec.android||{};$('status').textContent='Starting native Android build…';try{let r=await fetch('https://vihbsfrwnslnmheowkhy.supabase.co/functions/v1/apk-builder',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_HIMGxb-O6fj9O7OzT4ukuQ_jm5W8mWz','Authorization':'Bearer sb_publishable_HIMGxb-O6fj9O7OzT4ukuQ_jm5W8mWz'},body:JSON.stringify({action:'build',app_name:spec.project_name||'HHV App',app_package:a.package_name||'com.emzaro.hhvbuilt',version_name:'1.0.0',orientation:a.orientation||'portrait',spec})});let j=await r.json();if(!r.ok)throw Error(j.error||'Build request failed');$('status').textContent='Build started. Open GitHub Actions to monitor APK/AAB generation.'}catch(e){$('status').textContent='Build request failed: '+e.message}}render();</script></body></html>
