<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>HHV Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0d}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="studio" src="studio2.html" title="HHV Studio"></iframe><script>(function(){const f=document.getElementById('studio');function install(){try{const w=f.contentWindow,d=w.document;if(!w.add)return;const original=w.add;w.add=function(role,text){if(role!=='ai'){return original.call(w,role,text)};const s=w.state;if(!s||!Array.isArray(s.messages))return original.call(w,role,text);s.messages.push({role:'ai',text:''});if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();const bubbles=d.querySelectorAll('.msg.ai .bubble');const bubble=bubbles[bubbles.length-1];if(!bubble){s.messages[s.messages.length-1].text=text;if(typeof w.save==='function')w.save();return}let i=0;const speed=text.length>900?7:text.length>400?10:14;function type(){if(i>=text.length){s.messages[s.messages.length-1].text=text;if(typeof w.save==='function')w.save();return}const chunk=text.length>900?text.slice(i,i+3):text.slice(i,i+2);i+=chunk.length;const current=s.messages[s.messages.length-1];current.text=text.slice(0,i);bubble.textContent=current.text;const area=d.querySelector('.workspace');if(area)area.scrollTop=area.scrollHeight;setTimeout(type,speed)}type()};}catch(e){}}f.addEventListener('load',install);if(f.contentDocument&&f.contentDocument.readyState==='complete')install()})();</script></body></html>
