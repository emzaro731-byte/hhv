<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a10"><title>HHV — AI App Builder</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10}iframe{width:100%;height:100%;border:0}.review{position:fixed;right:14px;bottom:18px;z-index:20;border:1px solid #718cff;background:#5f7dff;color:#fff;border-radius:15px;padding:12px 17px;font:700 14px system-ui;box-shadow:0 10px 30px #0008;text-decoration:none}</style></head><body><iframe id="studio" src="studio3.html" title="HHV AI App Builder"></iframe><a class="review" href="review.html">📱 Review</a><script>const f=document.getElementById('studio');f.addEventListener('load',()=>{try{const w=f.contentWindow;w.fill=async function(answer){const input=w.document.getElementById('input');if(!input)return;input.value=answer;if(typeof w.auto==='function')w.auto();input.dispatchEvent(new Event('input',{bubbles:true}));setTimeout(()=>{if(typeof w.send==='function')w.send()},180)};const r=w.render;if(typeof r==='function')w.render=function(){r();setTimeout(()=>w.document.querySelectorAll('#cards button').forEach(b=>{b.type='button';b.style.cursor='pointer'}),0)}}catch(e){console.log('HHV question bridge',e)}});</script></body></html>
