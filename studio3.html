<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070811"><title>HHV Studio — AI App Builder</title><style>:root{--bg:#070811;--panel:#10131d;--panel2:#151a27;--line:#293249;--text:#f7f8ff;--muted:#929bb2;--blue:#6d8cff;--violet:#9a72ff;--good:#45d6a0;--bad:#ff7185}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,textarea{font:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-columns:230px 1fr 380px;background:radial-gradient(circle at 50% 15%,#162554 0,#090d1a 38%,#070811 75%);overflow:hidden}.side{border-right:1px solid var(--line);background:#0a0d14cc;backdrop-filter:blur(18px);padding:16px;display:flex;flex-direction:column;gap:12px}.brand{font-size:22px;font-weight:900;padding:8px}.brand span{color:#7e9bff}.new,.nav button,.sidefoot{border:1px solid var(--line);background:#121722;color:#cbd3e5;border-radius:12px;padding:11px;text-align:left}.new{background:linear-gradient(135deg,#6d8cff,#8064ff);border:0;color:#fff;font-weight:800;text-align:center}.section{font-size:10px;color:#68738a;text-transform:uppercase;font-weight:800;letter-spacing:.12em;margin-top:8px}.nav{display:grid;gap:5px}.nav button.active,.nav button:hover{background:#1a2233;color:#fff}.sidefoot{margin-top:auto;font-size:12px;color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#090c14b8;backdrop-filter:blur(16px)}.title{font-weight:800}.actions{display:flex;gap:8px}.ghost,.primary{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#141a27;color:#dce3f2}.primary{background:#fff;color:#0a0c12;font-weight:800}.workspace{flex:1;overflow:auto}.home{max-width:950px;margin:auto;padding:75px 20px 180px;text-align:center}.home h1{font-size:clamp(48px,8vw,86px);line-height:.95;letter-spacing:-4px;margin:0}.home h2{font-size:clamp(48px,8vw,86px);line-height:1;background:linear-gradient(90deg,#62cfff,#a173ff);background-clip:text;color:transparent;margin:5px 0 20px}.home p{max-width:720px;margin:0 auto 35px;color:#a3acc1;font-size:18px;line-height:1.5}.suggest{border:1px solid #344b91;background:#111a31cc;border-radius:26px;padding:22px;text-align:left}.suggest b{color:#78c5ff}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.chip,.choice{border:1px solid #3a4a70;background:#18243e;color:#e2e8f8;border-radius:999px;padding:10px 13px}.chat{max-width:900px;margin:auto;padding:25px 20px 190px}.msg{display:flex;margin:14px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:14px 16px;border-radius:17px;line-height:1.55;white-space:pre-wrap}.ai .bubble{background:#111621;border:1px solid var(--line)}.user .bubble{background:#29458d}.typing:after{content:'▋';animation:blink .7s infinite}@keyframes blink{50%{opacity:0}}.cards{display:grid;gap:12px;margin-top:18px}.card{background:#0f141e;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left}.card h3{margin:0 0 12px;font-size:14px}.choice{border-radius:11px;margin:4px 5px 4px 0}.task,.file{padding:9px 0;border-bottom:1px solid #202737;font-size:13px}.task:last-child,.file:last-child{border:0}.file{font-family:ui-monospace,monospace;color:#aeb8cc}.composerWrap{position:fixed;left:230px;right:380px;bottom:0;padding:15px 20px 24px;background:linear-gradient(transparent,var(--bg) 28%);z-index:10}.composer{max-width:900px;margin:auto;border:1px solid #394a70;background:#121824f2;border-radius:24px;padding:10px;box-shadow:0 20px 70px #000}.inputrow{display:flex;gap:8px;align-items:center}.composer textarea{flex:1;min-width:0;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:10px;font-size:16px}.circle,.platform{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#181f2d;color:#fff}.platform{width:auto;border-radius:20px;padding:0 13px}.send{background:linear-gradient(135deg,var(--blue),var(--violet));border:0;color:#fff;font-size:21px}.right{border-left:1px solid var(--line);background:#0a0d14;display:flex;flex-direction:column}.tabs{height:55px;display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:transparent;color:#79849b}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.panel{flex:1;overflow:auto;padding:18px}.phone{width:300px;min-height:540px;margin:10px auto;background:#f6f7fb;color:#111;border:7px solid #222631;border-radius:31px;overflow:hidden;box-shadow:0 20px 50px #000}.phonebar{height:55px;background:#fff;padding:18px;font-weight:900}.phonebody{padding:20px}.mockline{height:42px;background:#e4e6ec;border-radius:12px;margin:12px 0}.mockcard{height:110px;background:#e4e6ec;border-radius:16px;margin:12px 0}.code{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;color:#cbd3e4}.status{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.progress{display:grid;gap:8px}.stage{padding:10px 12px;border-radius:11px;background:#111722;border:1px solid var(--line)}.stage.on{border-color:#536fd0}.stage.done{border-color:#2b8067}.download{display:inline-block;text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:12px;color:#fff;background:#18223a;margin:5px 5px 0 0}@media(max-width:1000px){.app{grid-template-columns:72px 1fr}.side{padding:10px 8px}.brand{font-size:0}.brand:after{content:'✦';font-size:22px}.section,.nav span,.sidefoot,.new{display:none}.right{display:none}.composerWrap{left:72px;right:0}}@media(max-width:600px){.app{display:block}.side{display:none}.top{height:58px}.top .ghost{display:none}.home{padding:80px 14px 180px}.home h1,.home h2{letter-spacing:-2px}.chat{padding:18px 12px 170px}.composerWrap{left:0;padding:9px 9px 18px}.platform{display:none}.circle{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand">HHV <span>Studio</span></div><button class="new" onclick="newProject()">＋ New project</button><div class="section">Workspace</div><div class="nav"><button class="active" onclick="view('chat',this)">✦ <span>Chat</span></button><button onclick="view('plan',this)">☷ <span>Plan</span></button><button onclick="view('files',this)">⌘ <span>Files</span></button><button onclick="view('review',this)">▣ <span>Review</span></button><button onclick="view('build',this)">↗ <span>Build</span></button></div><div class="section">Connections</div><div class="nav"><button onclick="connect('Supabase')">◈ <span>Supabase</span></button><button onclick="connect('GitHub')">◉ <span>GitHub</span></button></div><div class="sidefoot">Project<br><b id="pname">Untitled app</b><br><span style="color:#45d6a0">● Workspace ready</span></div></aside><main class="main"><header class="top"><div class="title" id="title">HHV Studio</div><div class="actions"><button class="ghost" onclick="window.open('https://github.com/emzaro731-byte/hhv','_blank')">GitHub</button><button class="primary" onclick="build()">Build APK</button></div></header><div class="workspace" id="workspace"></div><div class="composerWrap"><div class="composer"><div class="inputrow"><button class="circle" onclick="newProject()">＋</button><textarea id="input" rows="1" placeholder="Describe the app you want to build…"></textarea><button class="platform">🤖 Android⌄</button><button class="circle" onclick="voice()">◉</button><button class="circle send" id="send" onclick="send()">↑</button></div></div></div></main><aside class="right"><div class="tabs"><button class="active" id="tabPreview" onclick="rightTab('preview',this)">Review</button><button onclick="rightTab('code',this)">Code</button><button onclick="rightTab('build',this)">Build</button></div><div class="panel" id="rightPanel"></div><div class="status" id="status">Ready · Describe an app to start</div></aside></div><script>const API='https://vihbsfrwnslnmheowkhy.supabase.co/functions/v1/apk-builder',KEY='sb_publishable_HIMGxb-O6fj9O7OzT4ukuQ_jm5W8mWz';let S=JSON.parse(localStorage.getItem('hhvStudio4')||'{"messages":[],"spec":null,"run":null}');const $=id=>document.getElementById(id),save=()=>localStorage.setItem('hhvStudio4',JSON.stringify(S)),sleep=x=>new Promise(r=>setTimeout(r,x));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderChat(){let w=$('workspace');w.innerHTML='<section class="chat"><div id="messages"></div><div id="cards" class="cards"></div></section>';let m=$('messages');m.innerHTML=S.messages.map(x=>`<div class="msg ${x.role}"><div class="bubble">${esc(x.text)}</div></div>`).join('');drawCards();$('pname').textContent=S.spec?.project_name||'Untitled app'}function drawCards(){let c=$('cards');if(!c)return;c.innerHTML='';let d=S.spec;if(!d)return;if(d.questions?.length){let h='<div class="card"><h3>✦ Questions</h3>';d.questions.slice(0,10).forEach((q,i)=>{h+=`<div style="margin:12px 0"><b>${i+1}. ${esc(q.question||q)}</b><div>${(q.options||[]).map(o=>`<button class="choice" onclick="answer(${JSON.stringify(o)})">${esc(o)}</button>`).join('')}</div></div>`});h+='</div>';c.innerHTML+=h}let tasks=d.tasks||d.plan;if(tasks?.length)c.innerHTML+=`<div class="card"><h3>Project plan</h3>${tasks.map(x=>`<div class="task">✓ ${esc(typeof x==='string'?x:(x.title||x.task||JSON.stringify(x)))}</div>`).join('')}</div>`;if(d.files?.length)c.innerHTML+=`<div class="card"><h3>Native files</h3>${d.files.map(x=>`<div class="file">${esc(typeof x==='string'?x:x.path||x.file||JSON.stringify(x))}</div>`).join('')}</div>`}function answer(x){$('input').value='My answer: '+x;$('input').focus();send()}async function ai(text){let m={role:'ai',text:''};S.messages.push(m);renderChat();let b=document.querySelector('#messages .msg:last-child .bubble');for(let i=0;i<text.length;i+=3){m.text+=text.slice(i,i+3);b.textContent=m.text;b.classList.add('typing');await sleep(12+Math.random()*20)}b.classList.remove('typing');save()}function user(x){S.messages.push({role:'user',text:x});save();renderChat()}function fill(x){$('input').value=x;$('input').focus()}$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'});async function send(){let p=$('input').value.trim();if(!p)return;$('input').value='';$('send').disabled=true;$('status').textContent='HHV AI is thinking…';user(p);try{let history=S.messages.slice(-18).map(x=>x.role.toUpperCase()+': '+x.text).join('\n');let prompt=`You are HHV Studio, a senior autonomous prompt-to-native-Android product engineer. Maintain context and never repeat answered questions. Infer the domain and ask only missing, high-value questions. For AI apps consider provider/model, streaming, memory, RAG, files, tools, web search, voice, image generation, auth, database, moderation, credits and admin. For stores consider catalog, cart, checkout, payment, delivery, orders, inventory and admin. For social consider profiles, feed, media, likes/comments, follows, messaging, notifications, moderation. For music consider catalog, playback, playlists, search, artists, downloads, subscriptions. For games consider engine, single/multiplayer, realtime, rooms, accounts, leaderboard. For fintech consider accounts, transactions, wallet, KYC, PIN/biometrics, limits, security and compliance. Prefer Kotlin + Jetpack Compose native Android, not WebView. Return strict JSON with project_name,summary,app_type,build_ready,questions[{question,options}],plan[],tasks[],files[],integrations[],risks[],android{package_name,min_sdk,orientation}. Latest user request: ${p}`;let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({action:'generate',prompt,history,app_name:'HHV Project',app_package:'com.emzaro.hhvbuilt',version_name:'1.0.0',orientation:'portrait'})});let d=await r.json();if(!r.ok)throw Error(d.error||'AI request failed');d=d.data||d.result||d;if(typeof d==='string')d=JSON.parse(d);S.spec=d;save();await ai((d.summary||'I analyzed your app.')+(d.questions?.length?'\n\nAnswer the questions above and I will continue the specification.':'\n\nThe project is build-ready. You can review it or build the native Android app.'));$('status').textContent=d.build_ready?'● Build-ready':'Questions required';rightTab('preview',document.getElementById('tabPreview'))}catch(e){await ai('I could not complete the AI analysis. '+e.message);$('status').textContent='AI service error'}finally{$('send').disabled=false}}function home(){renderChat()}function view(v,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('title').textContent=v[0].toUpperCase()+v.slice(1);if(v==='chat'){renderChat();return}let d=S.spec||{};if(v==='plan'){$('workspace').innerHTML='<section class="chat"><div class="card"><h3>Project plan</h3>'+((d.plan||d.tasks||[]).map(x=>`<div class="task">✓ ${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join('')||'Your plan will appear after AI analysis.')+'</div></section>'}else if(v==='files'){$('workspace').innerHTML='<section class="chat"><div class="card"><h3>Native Android files</h3>'+((d.files||[]).map(x=>`<div class="file">${esc(typeof x==='string'?x:JSON.stringify(x))}</div>`).join('')||'No files planned yet.')+'</div></section>'}else if(v==='review')rightTab('preview',document.getElementById('tabPreview'));else if(v==='build')rightTab('build',document.querySelectorAll('.tabs button')[2])}function rightTab(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let p=$('rightPanel');let d=S.spec||{};if(t==='preview'){p.innerHTML=`<div class="phone"><div class="phonebar">${esc(d.project_name||'Your app')}</div><div class="phonebody"><b>${esc(d.summary||'Native Android app preview')}</b><div class="mockline"></div><div class="mockcard"></div><div class="mockcard"></div><button class="download" onclick="build()">Build APK</button><button class="download" onclick="build()">Build AAB</button></div></div>`}else if(t==='code'){p.innerHTML='<div class="code">Native source is generated securely by the HHV backend and committed to GitHub during Build.\n\nKotlin\nAndroid SDK\nGradle\nAndroidManifest.xml\nViewModels\nRepositories\nResources\n\nSecrets never belong in frontend code.</div>'}else{p.innerHTML='<div class="progress"><div class="stage">1. Analyze project</div><div class="stage">2. Generate native source</div><div class="stage">3. Validate project</div><div class="stage">4. Commit to GitHub</div><div class="stage">5. Run Gradle</div><div class="stage">6. Test</div><div class="stage">7. Fix & rebuild</div><div class="stage">8. APK/AAB ready</div></div>'}}async function build(){if(!S.spec?.build_ready){$('status').textContent='Answer the remaining AI questions first';return}rightTab('build',document.querySelectorAll('.tabs button')[2]);$('status').textContent='Starting native Android build…';try{let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({action:'build',prompt:S.messages.filter(x=>x.role==='user').map(x=>x.text).join('\n'),spec:S.spec})});let d=await r.json();if(!r.ok)throw Error(d.error||'Build request failed');S.run=d.run_id;save();if(d.run_id)poll(d.run_id);else $('status').textContent='Build started · open GitHub Actions to monitor'}catch(e){$('status').textContent='Build failed to start: '+e.message}}async function poll(id){let labels=['Analyzing project','Generating Android source','Validating project','Uploading to GitHub','Starting Android build','Running Gradle','Testing','Fixing errors / rebuilding'];for(let i=0;i<labels.length;i++){ $('status').textContent=labels[i]+'…';await sleep(1100)}for(let n=0;n<60;n++){try{let r=await fetch(API+'?action=status&run_id='+encodeURIComponent(id),{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});let d=await r.json();if(d.status==='completed'){if(d.conclusion==='success'){$('status').innerHTML='<span style="color:#45d6a0">● Android build successful</span>';showArtifacts(d.artifacts||[])}else $('status').textContent='Build failed · inspect GitHub Actions logs';return}await sleep(2500)}catch(e){$('status').textContent='Monitoring build…'}}$('status').textContent='Build is still running · check GitHub Actions'}function showArtifacts(a){let p=$('rightPanel');p.innerHTML+='<div class="card"><h3>Your Android app is ready</h3>'+a.map(x=>`<button class="download" onclick="downloadArtifact(${x.id})">Download ${esc(x.name)}</button>`).join('')+'</div>'}function downloadArtifact(id){window.open(API+'?action=download&artifact_id='+encodeURIComponent(id),'_blank')}function newProject(){S={messages:[],spec:null,run:null};save();$('input').value='';$('status').textContent='Ready · Describe an app to start';renderChat();rightTab('preview',document.getElementById('tabPreview'))}function connect(x){alert(x+' integration is ready for secure backend connection. Keep private tokens in Supabase secrets.')}function voice(){if(!window.webkitSpeechRecognition){alert('Voice input is not supported in this browser.');return}let R=new webkitSpeechRecognition();R.lang='en-US';R.onresult=e=>{fill(e.results[0][0].transcript)};R.start()}renderChat();rightTab('preview',document.getElementById('tabPreview'));</script></body></html>
