<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a12"><title>HHV — AI App Builder</title><style>:root{--bg:#080a10;--panel:#11141c;--line:#252a39;--text:#f7f8ff;--muted:#9299ad;--blue:#6b8cff;--violet:#9a70ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a10;color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{min-height:100%;background:radial-gradient(circle at 50% 36%,#15224d 0,#0b1023 26%,#080a10 63%);overflow:auto}.top{height:72px;border-bottom:1px solid #1e2330;background:rgba(8,10,16,.76);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:850}.orb{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#fff,#6e8cff);box-shadow:0 0 24px #6b8cff}.topright{display:flex;align-items:center;gap:12px}.appname{font-size:21px;font-weight:800;color:#7ea0ff}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#89a0ae,#6273ff);font-size:24px}.menu{width:46px;height:46px;border-radius:50%;border:1px solid #303545;background:#171b25;color:#ddd;font-size:23px}.hero{max-width:980px;margin:auto;text-align:center;padding:105px 18px 210px}.hero h1{font-size:clamp(54px,10vw,104px);line-height:.95;letter-spacing:-5px;margin:0 0 8px;font-weight:900}.hero h2{font-size:clamp(50px,9vw,90px);line-height:1;margin:0;background:linear-gradient(90deg,#66cfff,#a275ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}.hero p{font-size:clamp(18px,3vw,28px);line-height:1.45;color:#9ca5bd;max-width:700px;margin:28px auto 40px}.suggest{max-width:760px;margin:auto;padding:25px;border:1px solid #304a91;border-radius:28px;background:linear-gradient(145deg,rgba(26,42,86,.76),rgba(16,20,38,.9));box-shadow:0 20px 80px rgba(26,54,150,.18);text-align:left}.suggestTitle{font-size:18px;color:#73bfff;font-weight:700;margin-bottom:15px}.chips{display:flex;flex-wrap:wrap;gap:12px}.chip{border:1px solid #3a4c79;background:#172444;color:#dce5ff;border-radius:999px;padding:13px 18px}.composerWrap{position:fixed;left:0;right:0;bottom:0;padding:18px 18px 30px;background:linear-gradient(transparent,#080a10 32%);z-index:6}.composer{max-width:900px;margin:auto;border:1px solid #35446c;border-radius:28px;background:rgba(20,24,35,.94);box-shadow:0 18px 70px #000;padding:12px 14px}.inputrow{display:flex;align-items:center;gap:10px}.plus,.mic,.send,.platform{height:50px;min-width:50px;border-radius:50%;border:1px solid #343b50;background:#171c28;color:#e7ebf7}.plus{font-size:30px}.platform{border-radius:28px;padding:0 16px;min-width:125px}.send{background:linear-gradient(135deg,#6d91ff,#765eff);border-color:#7b93ff;font-size:23px}.composer textarea{flex:1;min-width:0;min-height:52px;max-height:130px;background:transparent;border:0;outline:0;color:#fff;resize:none;font-size:18px;padding:13px 5px}.workspace{display:none;max-width:900px;margin:auto;padding:25px 18px 170px}.messages{display:flex;flex-direction:column;gap:16px}.msg{display:flex}.msg.user{justify-content:flex-end}.bubble{max-width:85%;padding:14px 17px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.ai .bubble{background:#151923;border:1px solid #292f3d}.user .bubble{background:#29458d}.typing:after{content:'▋';animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}.status{text-align:center;color:#7f89a0;font-size:13px;margin:12px}.builder .hero{display:none}.builder .workspace{display:block}.builder .composerWrap{position:fixed}.cards{margin-top:18px;display:grid;gap:12px}.card{border:1px solid #2b3242;border-radius:18px;background:#11151f;padding:15px}.card b{display:block;margin-bottom:10px}.card button{margin:5px;padding:9px 12px;border-radius:12px;border:1px solid #343d54;background:#181e2b;color:#ddd}@media(max-width:600px){.top{height:64px;padding:0 15px}.brand{font-size:21px}.appname{font-size:17px}.hero{padding:105px 18px 190px}.hero h1{letter-spacing:-3px}.hero p{margin:22px auto 32px}.suggest{padding:20px;border-radius:24px}.chip{width:100%;text-align:left}.composerWrap{padding:10px 10px 20px}.composer{border-radius:25px}.mic{display:none}.platform{min-width:72px;padding:0 10px}.send{min-width:50px}}</style></head><body><div class="app" id="app"><header class="top"><div class="brand"><i class="orb"></i> HHV</div><div class="topright"><span class="appname">App</span><div class="avatar">B</div><button class="menu">☰</button></div></header><main><section class="hero"><h1>Build the next</h1><h2>great app</h2><p>Create real mobile apps by chatting with AI, generate native Android code, build APK/AAB files, and ship your product.</p><div class="suggest"><div class="suggestTitle">✦ Try saying...</div><div class="chips"><button class="chip" onclick="fill('Build an AI assistant app with chat, memory, file upload and voice input')">✦ Build an AI assistant</button><button class="chip" onclick="fill('Create an online store with products, cart, checkout, orders and admin dashboard')">🛒 Create an online store</button><button class="chip" onclick="fill('Make a music app with streaming, playlists, search, artist profiles and downloads')">♫ Make a music app</button><button class="chip" onclick="fill('Build a multiplayer game with login, rooms, leaderboard and realtime gameplay')">🎮 Build a game</button></div></div></section><section class="workspace"><div id="messages" class="messages"></div><div id="status" class="status"></div><div id="cards" class="cards"></div></section></main><div class="composerWrap"><div class="composer"><div class="inputrow"><button class="plus" onclick="newChat()">+</button><textarea id="input" placeholder="Describe the app you want to build..." rows="1"></textarea><button class="platform">🤖　⌄</button><button class="mic" onclick="voice()">♩</button><button id="send" class="send" onclick="send()">↑</button></div></div></div></div><script>const API='https://vihbsfrwnslnmheowkhy.supabase.co/functions/v1/apk-builder',KEY='sb_publishable_HIMGxb-O6fj9O7OzT4ukuQ_jm5W8mWz';let S=JSON.parse(localStorage.getItem('hhvHHV3')||'{"messages":[],"spec":null}');const $=id=>document.getElementById(id),save=()=>localStorage.setItem('hhvHHV3',JSON.stringify(S)),sleep=ms=>new Promise(r=>setTimeout(r,ms));function fill(x){$('input').value=x;$('input').focus();auto()}function auto(){let e=$('input');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,130)+'px'}$('input').addEventListener('input',auto);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});function render(){let box=$('messages');box.innerHTML=S.messages.map(m=>`<div class="msg ${m.role}"><div class="bubble">${esc(m.text)}</div></div>`).join('');box.scrollTop=box.scrollHeight}function esc(s){return String(s||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function user(text){S.messages.push({role:'user',text});render();save()}async function typeAI(text){let m={role:'ai',text:''};S.messages.push(m);render();let bubble=$('messages').lastElementChild.querySelector('.bubble');for(let i=0;i<text.length;i+=3){m.text+=text.slice(i,i+3);bubble.textContent=m.text;bubble.classList.add('typing');$('messages').lastElementChild.scrollIntoView({block:'end',behavior:'smooth'});await sleep(12+Math.random()*24)}bubble.classList.remove('typing');save()}function draw(d){$('cards').innerHTML='';if(d.questions?.length){$('cards').innerHTML='<div class="card"><b>Questions from HHV AI</b>'+d.questions.map((q,i)=>`<div><b>${i+1}. ${esc(q.question||q)}</b>${(q.options||[]).map(o=>`<button onclick="fill(${JSON.stringify(o)})">${esc(o)}</button>`).join('')}</div>`).join('')+'</div>'}if(d.tasks?.length)$('cards').innerHTML+='<div class="card"><b>Build plan</b>'+d.tasks.map(t=>`<div>✓ ${esc(t)}</div>`).join('')+'</div>'}async function send(){let p=$('input').value.trim();if(!p)return;$('input').value='';auto();user(p);$('app').classList.add('builder');$('send').disabled=true;$('status').textContent='Groq is thinking… analyzing your app requirements';try{let history=S.messages.slice(-14).map(x=>x.role.toUpperCase()+': '+x.text).join('\n');let instruction=`You are HHV Studio, an autonomous prompt-to-native-Android product engineer. Analyze the user's request and decide intelligently what requirements are missing. Ask domain-specific questions instead of generic questions. For AI apps ask about provider/model, streaming, memory, RAG, files, tools, web search, voice, image generation, auth, database, moderation, billing and admin as relevant. For stores ask catalog, payments, shipping, orders, inventory and admin. For games ask engine, multiplayer, rooms, realtime, auth and leaderboard. For social apps ask profiles, follows, posts, media, messaging, notifications and moderation. For fintech ask accounts, transactions, KYC, security and compliance. For media/music ask catalog, playback, playlists, search, downloads and subscriptions. Return STRICT JSON: {project_name,summary,app_type,build_ready,questions:[{question,options}],plan:[...],tasks:[...],files:[...],integrations:[...],risks:[...],android:{package_name,min_sdk,orientation}}. Only mark build_ready true when enough information exists. User request: ${p}`;let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({action:'generate',prompt:instruction,history,app_name:'HHV Project',app_package:'com.emzaro.hhvbuilt',version_name:'1.0.0',orientation:'portrait'})});let j=await r.json();if(!r.ok)throw Error(j.error||'AI request failed');let d=j.data||j.result||j;if(typeof d==='string'){try{d=JSON.parse(d)}catch{d={summary:d}}}S.spec=d;draw(d);await typeAI((d.summary||'I analyzed your app idea.')+(d.questions?.length?'\n\nI have a few important questions before generating the native Android build.':'\n\nYour specification is ready for the native Android build.'));$('status').textContent=d.build_ready?'Ready to build native Android APK/AAB.':'Answer the questions above to continue.';save()}catch(e){await typeAI('I could not reach the builder service right now. Please try again.\n\n'+e.message);$('status').textContent='Connection error'}finally{$('send').disabled=false}}function newChat(){S={messages:[],spec:null};save();render();$('cards').innerHTML='';$('status').textContent='';$('app').classList.remove('builder');$('input').value='';$('input').focus()}function voice(){if(!('webkitSpeechRecognition'in window)){alert('Voice input is not supported in this browser.');return}let R=new webkitSpeechRecognition();R.lang='en-US';R.onresult=e=>{ $('input').value=e.results[0][0].transcript;auto()};R.start()}render();</script></body></html>
