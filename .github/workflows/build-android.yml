name: Build Native Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Native app name"
        required: false
        default: "My Native App"
      app_package:
        description: "Android package name"
        required: false
        default: "com.example.myapp"
      app_description:
        description: "App description"
        required: false
        default: "Built with APK Builder Hub"
      orientation:
        description: "Screen orientation"
        required: false
        default: "portrait"
      version_name:
        description: "App version"
        required: false
        default: "1.0.0"
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_NAME: ${{ inputs.app_name || 'My Native App' }}
      APP_PACKAGE: ${{ inputs.app_package || 'com.example.myapp' }}
      APP_DESCRIPTION: ${{ inputs.app_description || 'Built with APK Builder Hub' }}
      ORIENTATION: ${{ inputs.orientation || 'portrait' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate native app configuration
        shell: bash
        run: |
          [[ "$APP_PACKAGE" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]] || { echo "Invalid Android package name"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must use x.y.z"; exit 1; }

      - name: Build real native APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon -PappName="$APP_NAME" -PappPackage="$APP_PACKAGE" -PappDescription="$APP_DESCRIPTION" -Porientation="$ORIENTATION" -PversionName="$VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
