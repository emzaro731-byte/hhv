name: Build Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Website URL to package"
        required: false
        default: "https://emzaro731-byte.github.io/hhv/"
      version_name:
        description: "App version"
        required: false
        default: "1.0.0"
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEB_URL: ${{ inputs.web_url || 'https://emzaro731-byte.github.io/hhv/' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon -PwebUrl="$WEB_URL" -PversionName="$VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
